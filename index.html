<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1d211a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Пепельные Королевства</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js" integrity="sha384-5UGTcMIxVUKFeJH0zOS3lqMAZNBG+fCXJbi3UglUq6ABO4MQJu6rxNa+MPP+qtwq" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Fira+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{
  --iron:#1d211a; --iron2:#272d22; --iron3:#343c2d; --line:#4a5340;
  --parch:#ecdfc2; --muted:#a9ad94; --bronze:#c9954b; --bronze2:#e8b765; --blood:#c9473a; --good:#69c46f;
  --disp:"Alegreya SC", "Palatino Linotype", Georgia, serif; --ui:"Fira Sans Condensed", "Arial Narrow", Roboto, sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#141711;color:var(--parch);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv,#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#gl{pointer-events:none}
button{font-family:var(--ui);color:var(--parch);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--bronze2);outline-offset:2px}
.hud{position:absolute;z-index:5}
#top{top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 8px 5px 12px;background:linear-gradient(rgba(34,38,29,.92),rgba(22,25,19,.9));border:1px solid #5a4d33;border-radius:10px;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#top .gold{color:var(--bronze2);font-weight:700}
#top .gold::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,#d9a53a 60%,#8a5a18);margin-right:5px;vertical-align:-1px}
#top .inc{color:var(--muted);font-size:13px}
#top .pop.full{color:var(--blood)}
#top .pw{color:#e7b8ff}
.vet{color:#e6c25a;font-size:.85em;letter-spacing:1px}
#glob button.ready{border-color:#b98bff;box-shadow:0 0 10px rgba(185,139,255,.45)}
#top .ico{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--iron2);font-size:14px;padding:0}
#heroes{top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 8px);display:flex;flex-direction:column;gap:6px}
.hp{width:58px;background:none;border:none;padding:0;position:relative;cursor:pointer}
.hp img{width:54px;height:54px;display:block;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a4530,#1b1a12);box-shadow:0 0 0 2px #1d160c,0 0 0 4px #b8893c,0 3px 10px rgba(0,0,0,.6)}
.hp.dead img,.hp.none img{filter:grayscale(1) brightness(.55)}
.hp .lv{position:absolute;right:3px;top:3px;background:var(--bronze);color:#1b1408;font-weight:700;font-size:11px;border-radius:5px;padding:0 4px}
.hp .bar{height:4px;background:#3a2522;border-radius:2px;margin:7px 4px 0;overflow:hidden;box-shadow:0 0 0 1px #1d160c}.hp .bar i{display:block;height:100%;background:var(--good)}
.hp .st{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:10px;font-weight:600;text-shadow:0 1px 2px #000}
.hp.sel img{box-shadow:0 0 0 2px #1d160c,0 0 0 4px #ffd46a,0 0 14px rgba(255,210,110,.7)}
#toasts{top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(92vw,520px)}
.toast{background:rgba(24,28,21,.9);border-left:3px solid var(--bronze);padding:5px 10px;border-radius:6px;font-size:13px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
#hint{top:calc(env(safe-area-inset-top,0px) + 50px);right:10px;background:rgba(40,30,12,.92);border:1px solid var(--bronze);padding:6px 10px;border-radius:8px;font-size:13px;max-width:46vw}
#bottom{left:0;right:0;bottom:0;display:flex;gap:8px;align-items:stretch;padding:6px calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 8px);background:linear-gradient(to top,rgba(18,20,15,.98),rgba(24,27,20,.9));border-top:1px solid #6a5a3a;box-shadow:0 -1px 0 rgba(232,183,101,.18),0 -8px 24px rgba(0,0,0,.35);pointer-events:auto}
#mini{width:118px;height:118px;border-radius:50%;flex:none;touch-action:none;background:#7d6440;align-self:center;margin:2px 4px;box-shadow:0 0 0 2px #1d160c,0 0 0 5px #b8893c,0 0 0 6px #6e4f1f,0 0 0 8px #241a0e,0 4px 16px rgba(0,0,0,.7)}
#panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;overflow:hidden}
#panel .ttl{font-family:var(--disp);font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.cb{flex:none;min-width:62px;height:58px;border-radius:9px;border:1px solid #6a5530;background:linear-gradient(#3a3526,#221f17);box-shadow:inset 0 1px 0 rgba(255,220,150,.12),0 2px 4px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 6px;position:relative;font-size:11px;line-height:1.05;text-align:center;overflow:hidden}
.cb img{width:30px;height:30px}
.cb .c{color:var(--bronze2);font-weight:700;font-variant-numeric:tabular-nums}
.cb.off{opacity:.45}
.cb.on{border-color:var(--bronze2);background:linear-gradient(#4a3f25,#30291a)}
.cb.done{border-color:#5f7a3a;background:linear-gradient(#2f3a24,#20281a)}.cb.done .c{color:#9fd86a}
.bsub{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.cb .g{font-size:21px;line-height:1;color:var(--bronze2)}
.cb .cd{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.cb .lk{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cb .qn{position:absolute;top:2px;right:4px;font-size:11px;font-weight:700;color:#fff;background:var(--blood);border-radius:6px;padding:0 4px}
.cb .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--good)}
.cb.pas{border-style:dashed}
#glob{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:none}
#glob button{width:70px;min-height:30px;border-radius:8px;border:1px solid #7a6034;background:linear-gradient(#4a3f28,#2a2418);font-size:13px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,220,150,.15)}
#glob button.on{border-color:var(--bronze2);background:#4a3f25}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--iron2);border:1px solid var(--line);border-radius:6px;padding:1px 5px 1px 2px;font-size:12px}
.chip img{width:20px;height:20px}
/* screens */
#scr{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 40%,rgba(18,20,15,.35),rgba(10,11,8,.86))}
.card{width:min(680px,100%);max-height:100%;overflow:auto;background:rgba(26,30,23,.95);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-family:var(--disp);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:.95;letter-spacing:.01em;text-wrap:balance;color:var(--parch);text-shadow:0 2px 0 #000,0 0 24px rgba(201,149,75,.35);margin:0}
.logo small{display:block;font-size:.36em;color:var(--bronze2);letter-spacing:.14em;margin-top:8px;font-weight:500}
.lead{color:var(--muted);font-size:14px;line-height:1.45;max-width:60ch;margin:10px 0 16px}
.btns{display:flex;flex-direction:column;gap:8px}
.big{min-height:48px;border-radius:10px;border:1px solid var(--bronze);background:linear-gradient(#5a4526,#3c2e1a);font-size:17px;font-weight:700;letter-spacing:.02em;padding:8px 14px}
.big.alt{border-color:var(--line);background:linear-gradient(#343c2d,#262c21)}
.big:disabled{opacity:.45}
h2{font-family:var(--disp);font-size:24px;margin:0 0 10px;text-wrap:balance}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze2);margin:14px 0 6px}
.roomrow{display:flex;gap:8px;align-items:center}.roomrow input{flex:1}.roomrow .big{min-height:38px;font-size:15px;flex:0 0 auto}
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.race{border:1px solid var(--line);border-radius:10px;background:var(--iron2);padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px}
.race.on{border-color:var(--bronze2);box-shadow:0 0 0 1px var(--bronze2);background:#3a3220}
.race b{font-family:var(--disp);font-size:17px}
.race span{font-size:12px;color:var(--muted);line-height:1.3}
.race .hh{display:flex;gap:4px}.race .hh img{width:34px;height:34px;background:#2d3526;border-radius:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--iron2);border-radius:8px;padding:8px 12px;font-size:14px;min-height:40px}
.seg button.on{border-color:var(--bronze2);background:#4a3f25}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:8px;background:var(--iron2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;flex-wrap:wrap}
.slot .dot{width:12px;height:12px;border-radius:50%}
.slot .nm{flex:1;min-width:90px;font-weight:600}
.slot select,input[type=text]{background:#171a14;color:var(--parch);border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-family:var(--ui);font-size:14px}
input[type=text]{width:100%;box-sizing:border-box;font-size:16px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.warn{font-size:13px;color:#f0c08a;background:rgba(120,70,20,.25);border:1px solid rgba(201,149,75,.4);border-radius:8px;padding:8px 10px;line-height:1.4}
.x{float:right;border:1px solid var(--line);background:var(--iron2);border-radius:8px;width:36px;height:36px;font-size:16px}
.help p{font-size:14px;line-height:1.5;margin:6px 0;color:#d9cfb5}
.help b{color:var(--bronze2)}
.sk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:4px 0;line-height:1.35}
.sk i{font-style:normal;color:var(--bronze2);width:18px;flex:none;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:12px 0}
.stats div{background:var(--iron2);border:1px solid var(--line);border-radius:8px;padding:8px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.win{color:var(--bronze2)}.lose{color:var(--blood)}
@media (max-height:430px){
  #mini{width:96px;height:96px}
  .cb{height:50px;min-width:56px}.cb img{width:24px;height:24px}
  #panel .ttl{font-size:14px}
  .hp{width:46px}.hp img{width:40px;height:40px}
  #glob button{width:60px;font-size:12px}
}
@media (max-width:560px){
  #bottom{flex-wrap:wrap}
  #panel{order:3;flex-basis:100%}
  #mini{width:98px;height:98px}
  #glob{display:flex;flex-direction:row;flex:1;align-self:flex-start;flex-wrap:wrap}
  #glob button{flex:1;width:auto;min-height:38px}
  #top{font-size:13px;gap:6px;left:auto;right:calc(env(safe-area-inset-right,0px) + 6px);transform:none;padding:4px 5px 4px 8px}
  #top .inc{display:none}
  #toasts{top:calc(env(safe-area-inset-top,0px) + 48px);left:74px;right:8px;transform:none;width:auto}
}
#quick{left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(var(--bh,100px) + 8px);display:flex;gap:5px;align-items:center}
#quick button{height:34px;padding:0 10px;border-radius:17px;border:1px solid var(--line);background:rgba(30,34,26,.9);font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#quick button b{color:var(--bronze2);font-variant-numeric:tabular-nums;margin-left:2px}
#quick button.off{opacity:.45}
#quick .sep{width:6px}
#quick .grp{width:34px;padding:0;position:relative;font-family:var(--disp);font-size:15px}
#quick .grp.has{border-color:var(--bronze)}
#quick .grp b{position:absolute;top:-6px;right:-6px;background:var(--bronze);color:#1b1408;font-family:var(--ui);font-size:10px;border-radius:7px;padding:0 4px;margin:0}
#skillbar{right:calc(env(safe-area-inset-right,0px) + 8px);bottom:calc(var(--bh,100px) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.skrow{display:flex;gap:6px;align-items:center}
.skgrid{display:grid;grid-template-columns:repeat(2,auto);gap:20px 10px;justify-items:center;align-items:center}
.skh{height:38px;display:flex;align-items:center;gap:6px;padding:0 10px 0 3px;border-radius:19px;border:1px solid var(--line);background:rgba(24,28,21,.92);position:relative;font-size:12px;font-weight:600;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4);max-width:170px;white-space:nowrap}
.skh img{width:32px;height:32px;border-radius:50%;background:#2d3526;flex:none}
.skh span{overflow:hidden;text-overflow:ellipsis}
.skh i{position:absolute;left:0;bottom:0;height:3px;background:var(--good)}
.skh.on{border-color:var(--bronze2);box-shadow:0 0 0 1px var(--bronze2),0 2px 8px rgba(0,0,0,.4)}
.sk2{width:60px;height:60px;border-radius:50%;border:3px solid #8a6a34;background:radial-gradient(circle at 35% 30%,#4d4838,#1b1d16 75%);position:relative;display:flex;align-items:center;justify-content:center;font-size:25px;color:var(--bronze2);box-shadow:0 4px 14px rgba(0,0,0,.55);padding:0}
.sk2 small{position:absolute;top:100%;margin-top:2px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--parch);white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.sk2 .cdw{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p) * 1turn),transparent 0)}
.sk2 > b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-family:var(--ui)}
.sk2 b.lv{inset:auto;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#2a2a24;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.sk2.ready{border-color:var(--bronze2);box-shadow:0 0 0 1px rgba(232,183,101,.35),0 0 14px rgba(232,183,101,.45),0 4px 14px rgba(0,0,0,.55)}
.sk2.lock{filter:grayscale(1) brightness(.6)}
.sk2.pas{border-style:dashed;font-size:20px;width:48px;height:48px}
.sk2.on{border-color:#ff8a4a;box-shadow:0 0 16px rgba(255,120,60,.7)}
.autob{width:52px;height:38px;border-radius:19px;border:1px solid var(--line);background:rgba(30,34,26,.92);font-size:11px;font-weight:700;letter-spacing:.04em}
.autob.on{border-color:var(--bronze2);background:#4a3f25;color:var(--bronze2)}
.toast.go{pointer-events:auto;cursor:pointer;border-left-color:var(--blood)}
@media (max-width:560px){#quick{bottom:calc(var(--bh,160px) + 8px);flex-wrap:wrap;right:150px}#skillbar{gap:6px}.skgrid{gap:18px 8px}.sk2{width:50px;height:50px;font-size:20px}.skh{max-width:130px}}
@media (max-height:430px){.sk2{width:48px;height:48px;font-size:20px}.sk2.pas{width:40px;height:40px}.skgrid{gap:16px 8px}.skh,.autob{height:32px}.skh img{width:26px;height:26px}#skillbar{gap:5px;bottom:calc(var(--bh,100px) + 18px)}#quick button{height:30px;font-size:12px;padding:0 8px}#quick .grp{width:30px}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* ===== BFME-style palette ===== */
:root{--ms:152px;--rs:178px;--sz:46px;--gold1:#e9c46a}
#palette{left:calc(env(safe-area-inset-left,0px) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 4px);display:flex;align-items:flex-end;pointer-events:none}
#palette>*{pointer-events:auto}
#mapwrap{position:relative;width:var(--ms);height:var(--ms);flex:none;order:1}
.mframe{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,#8a6424,#f0d189,#9a6f28,#e2bb6a,#6d4a18,#f0d189,#8a6424);box-shadow:0 6px 20px rgba(0,0,0,.7),inset 0 0 0 2px #2a1c08}
.mframe::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#20180c;box-shadow:inset 0 0 0 2px #3a2810}
#mini{position:absolute;inset:11px;width:calc(100% - 22px);height:calc(100% - 22px);border-radius:50%;touch-action:none;background:#7d6440;box-shadow:none;margin:0}
#bBook{position:absolute;left:-2px;top:-4px;width:48px;height:48px;border-radius:50%;border:none;padding:0;background:radial-gradient(circle at 40% 35%,#5b3f86,#1e1230 70%);box-shadow:0 0 0 2px #1d160c,0 0 0 4px #c9a04a,0 3px 10px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;z-index:2}
#bBook .g{font-size:15px;color:#e7c8ff}
#bBook b{font-size:15px;color:#fff;font-family:var(--disp)}
#bBook i{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(#b98bff calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 25px,#000 26px);mask:radial-gradient(circle,transparent 25px,#000 26px);pointer-events:none}
#bBook.ready{animation:bookglow 1.4s ease-in-out infinite}
@keyframes bookglow{50%{box-shadow:0 0 0 2px #1d160c,0 0 0 4px #e7c8ff,0 0 18px rgba(200,150,255,.9)}}
.clk{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:linear-gradient(#3a2c14,#1d150a);border:1px solid #b8893c;border-radius:10px;padding:1px 7px;font-size:12px;font-variant-numeric:tabular-nums;z-index:2}
.res{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;white-space:nowrap;background:linear-gradient(#3e3017,#1c1409);border:1px solid #c9994a;border-radius:12px;padding:2px 10px;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.6);z-index:2}
.res .gold{color:var(--bronze2);font-weight:700}
.res .gold::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,#d9a53a 60%,#8a5a18);margin-right:4px;vertical-align:-1px}
.res .inc{color:var(--muted);font-size:11px;margin-left:-4px}
.res .pop::before{content:"\2694  ";color:#d8cfb8}
.res .pop.full{color:var(--blood)}
#cmd{position:relative;width:var(--rs);height:var(--rs);flex:none;margin-left:6px;order:2}
#ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#2a2012 0 36%,#3b2c14 37% 40%,#1a1409 41% 58%,#2a2012 59% 62%,#171108 63%);box-shadow:0 0 0 3px #1d160c,0 0 0 6px #b8893c,0 0 0 7px #5e4216,0 6px 20px rgba(0,0,0,.7)}
#ring .core{position:absolute;left:50%;top:50%;width:40%;height:40%;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,#4a4530,#15130c);box-shadow:0 0 0 2px #1d160c,0 0 0 4px #9a7432}
#ring .core img{width:92%;height:92%;border-radius:50%;object-fit:contain}

    heroes(pi) {

    },
    sqInfo(id) { const i = this.sqi && this.sqi.get(id), m = this.ents.find(e => e.sq === id); return { lvl: m ? m.lvl || 1 : 1, xp: i ? i.xp : 0, cd: i ? i.cd : 0 }; },
    queue(bid) { const q = this.qs.get(bid); if (!q) return null; return q[2] >= 100 ? { n: q[0], prog: q[1] / 99, ti: -1, up: UPGRADES[q[2] - 100].k, items: [] } : { n: q[0], prog: q[1] / 99, ti: q[2], items: [] }; },
    send(c) { this.seq++; this.outbox.push([this.seq, c]); if (this.outbox.length > 12) this.outbox.shift(); Net.set({ cmd: { l: this.outbox } }); },
    canPlace(key, x, y) { return Game.prototype.canPlace.call({ map: makeMap(seed, mapType), ents: this.ents, enemy: (a, b) => a !== b && players[a] && players[b] && players[a].team !== players[b].team }, me, key, x, y); },
    teamOf(i) { return players[i] ? players[i].team : -1; },
    nplayers: players.length,
    ingest(sn, now) {

      this.lastRecv = now; this.lastSnapT = sn.t;

function sqIds(e) { if (!e || !e.sq) return e ? [e.id] : []; const out = []; for (const o of V.ents) if (o.sq === e.sq) out.push(o.id); return out; }

// compact command payload: battalions by id, single units (heroes, spirits) by entity id

// ---------- world picking ----------
function pick(sx, sy, touch) {

    let d;
    const k = R.pxAt(e.rx, e.ry);
    if (e.d.kind === 'b') { const c = R.proj(e.rx, e.ry, e.r * (R.is3D ? 1 : 0.5)); d = Math.hypot(sx - c.x, (sy - c.y) * 1.1) - e.r * 1.05 * k; }
    else { const c = R.proj(e.rx, e.ry, (e.d.hero ? 22 : e.d.sub === 'cav' ? 18 : 12) * (R.is3D ? 1.3 : 1)); d = Math.hypot(sx - c.x, (sy - c.y) * 0.8) - (e.r + (e.sq ? 3 : 6)) * k; }
    if (d < tol && d < bd) { bd = d; best = e; }
  }

}
function issueAt(wx, wy, target) {

  if (target && V.teamOf(target.owner) !== V.teamOf(V.me)) { V.send(Object.assign({ c: 'atk', t: target.id }, selCmd())); UI.targetMark = { id: target.id, t: performance.now() / 1000 }; }
  else { V.send(Object.assign({ c: 'move', x: wx, y: wy, a: UI.marchMode ? 0 : 1 }, selCmd())); pingAt(wx, wy, UI.marchMode ? '#8fd0ff' : '#f6e27a'); UI.moveMark = { x: wx, y: wy, t: performance.now() / 1000, n: selSquads().length }; }

}
function pingAt(x, y, col) { UI.pings.push({ x, y, col, t: performance.now() / 1000 }); }

function tapWorld(sx, sy, touch) {
  const w = R.toWorld(sx, sy);
  const cm = UI.cmode;
  if (cm) {
    if (cm.t === 'build') {
      const ok = V.canPlace(cm.key, w.x, w.y);
      if (UI.ghost && Math.hypot(UI.ghost.x - w.x, UI.ghost.y - w.y) < 40 / R.cam.z + 20 && UI.ghost.ok) { buildHere(); return; }
      if (!touch && ok) { UI.ghost = { d: DEF[cm.key], x: w.x, y: w.y, ok }; buildHere(); return; }
      UI.ghost = { d: DEF[cm.key], x: w.x, y: w.y, ok }; UI.panelSig = '';
      hint(ok ? 'Нажмите ещё раз на силуэт или «Поставить»' : 'Здесь строить нельзя: слишком далеко от базы или занято');
      return;
    }
    if (cm.t === 'skill') { V.send({ c: 'skill', h: cm.h, s: cm.s, x: w.x, y: w.y }); pingAt(w.x, w.y, '#ffb35a'); UI.cmode = null; hint(''); UI.panelSig = ''; Snd.play('click'); return; }

    if (cm.t === 'rally') { V.send({ c: 'rally', b: cm.b, x: w.x, y: w.y }); const b = V.get(cm.b); if (b) b.rally = { x: w.x, y: w.y }; UI.cmode = null; hint(''); UI.panelSig = ''; pingAt(w.x, w.y, '#f6e27a'); return; }
  }
  const e = pick(sx, sy, touch);
  const now = performance.now();
  const selW = mySel().filter(u => u.d.kind === 'u');
  if (e && e.owner === V.me && e.d.kind === 'b' && selW.length && selW.every(u => u.d.worker) && (e.built < 1 || e.hp < e.maxhp - 1)) { V.send({ c: 'work', t: e.id, ids: selW.map(u => u.id) }); toast(e.built < 1 ? 'Строители продолжают стройку' : 'Строители чинят здание'); Snd.play('build'); return; }

    } else setSel(sqIds(e));

}

function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  for (const g of guests) {
