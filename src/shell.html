<title>Пепельные Королевства</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Fira+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{
  --iron:#1d211a; --iron2:#272d22; --iron3:#343c2d; --line:#4a5340;
  --parch:#ecdfc2; --muted:#a9ad94; --bronze:#c9954b; --bronze2:#e8b765; --blood:#c9473a; --good:#69c46f;
  --disp:"Alegreya SC", "Palatino Linotype", Georgia, serif; --ui:"Fira Sans Condensed", "Arial Narrow", Roboto, sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#141711;color:var(--parch);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--ui);color:var(--parch);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--bronze2);outline-offset:2px}
.hud{position:absolute;z-index:5}
#top{top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 8px 5px 12px;background:rgba(24,28,21,.86);border:1px solid var(--line);border-radius:10px;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#top .gold{color:var(--bronze2);font-weight:700}
#top .gold::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,#d9a53a 60%,#8a5a18);margin-right:5px;vertical-align:-1px}
#top .inc{color:var(--muted);font-size:13px}
#top .pop.full{color:var(--blood)}
#top .pw{color:#e7b8ff}
#glob button.ready{border-color:#b98bff;box-shadow:0 0 10px rgba(185,139,255,.45)}
#top .ico{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--iron2);font-size:14px;padding:0}
#heroes{top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 8px);display:flex;flex-direction:column;gap:6px}
.hp{width:58px;background:rgba(24,28,21,.88);border:1px solid var(--line);border-radius:9px;padding:3px;position:relative;cursor:pointer}
.hp img{width:52px;height:52px;display:block;border-radius:6px;background:#2d3526}
.hp.dead img,.hp.none img{filter:grayscale(1) brightness(.55)}
.hp .lv{position:absolute;right:3px;top:3px;background:var(--bronze);color:#1b1408;font-weight:700;font-size:11px;border-radius:5px;padding:0 4px}
.hp .bar{height:4px;background:#3a2522;border-radius:2px;margin-top:3px;overflow:hidden}.hp .bar i{display:block;height:100%;background:var(--good)}
.hp .st{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:10px;font-weight:600;text-shadow:0 1px 2px #000}
.hp.sel{border-color:var(--bronze2);box-shadow:0 0 0 1px var(--bronze2)}
#toasts{top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(92vw,520px)}
.toast{background:rgba(24,28,21,.9);border-left:3px solid var(--bronze);padding:5px 10px;border-radius:6px;font-size:13px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
#hint{top:calc(env(safe-area-inset-top,0px) + 50px);right:10px;background:rgba(40,30,12,.92);border:1px solid var(--bronze);padding:6px 10px;border-radius:8px;font-size:13px;max-width:46vw}
#bottom{left:0;right:0;bottom:0;display:flex;gap:8px;align-items:stretch;padding:6px calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 8px);background:linear-gradient(to top,rgba(20,23,17,.97),rgba(20,23,17,.88));border-top:1px solid var(--line);pointer-events:auto}
#mini{width:150px;height:103px;border:1px solid var(--line);border-radius:6px;flex:none;touch-action:none;background:#2c3a22}
#panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;overflow:hidden}
#panel .ttl{font-family:var(--disp);font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.cb{flex:none;min-width:62px;height:58px;border-radius:9px;border:1px solid var(--line);background:linear-gradient(#323a2b,#262c21);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 6px;position:relative;font-size:11px;line-height:1.05;text-align:center;overflow:hidden}
.cb img{width:30px;height:30px}
.cb .c{color:var(--bronze2);font-weight:700;font-variant-numeric:tabular-nums}
.cb.off{opacity:.45}
.cb.on{border-color:var(--bronze2);background:linear-gradient(#4a3f25,#30291a)}
.cb .g{font-size:21px;line-height:1;color:var(--bronze2)}
.cb .cd{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.cb .lk{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cb .qn{position:absolute;top:2px;right:4px;font-size:11px;font-weight:700;color:#fff;background:var(--blood);border-radius:6px;padding:0 4px}
.cb .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--good)}
.cb.pas{border-style:dashed}
#glob{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:none}
#glob button{width:70px;min-height:30px;border-radius:8px;border:1px solid var(--line);background:var(--iron3);font-size:13px;font-weight:600}
#glob button.on{border-color:var(--bronze2);background:#4a3f25}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--iron2);border:1px solid var(--line);border-radius:6px;padding:1px 5px 1px 2px;font-size:12px}
.chip img{width:20px;height:20px}
/* screens */
#scr{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 40%,rgba(18,20,15,.35),rgba(10,11,8,.86))}
.card{width:min(680px,100%);max-height:100%;overflow:auto;background:rgba(26,30,23,.95);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-family:var(--disp);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:.95;letter-spacing:.01em;text-wrap:balance;color:var(--parch);text-shadow:0 2px 0 #000,0 0 24px rgba(201,149,75,.35);margin:0}
.logo small{display:block;font-size:.36em;color:var(--bronze2);letter-spacing:.14em;margin-top:8px;font-weight:500}
.lead{color:var(--muted);font-size:14px;line-height:1.45;max-width:60ch;margin:10px 0 16px}
.btns{display:flex;flex-direction:column;gap:8px}
.big{min-height:48px;border-radius:10px;border:1px solid var(--bronze);background:linear-gradient(#5a4526,#3c2e1a);font-size:17px;font-weight:700;letter-spacing:.02em;padding:8px 14px}
.big.alt{border-color:var(--line);background:linear-gradient(#343c2d,#262c21)}
.big:disabled{opacity:.45}
h2{font-family:var(--disp);font-size:24px;margin:0 0 10px;text-wrap:balance}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze2);margin:14px 0 6px}
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.race{border:1px solid var(--line);border-radius:10px;background:var(--iron2);padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px}
.race.on{border-color:var(--bronze2);box-shadow:0 0 0 1px var(--bronze2);background:#3a3220}
.race b{font-family:var(--disp);font-size:17px}
.race span{font-size:12px;color:var(--muted);line-height:1.3}
.race .hh{display:flex;gap:4px}.race .hh img{width:34px;height:34px;background:#2d3526;border-radius:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--iron2);border-radius:8px;padding:8px 12px;font-size:14px;min-height:40px}
.seg button.on{border-color:var(--bronze2);background:#4a3f25}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:8px;background:var(--iron2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;flex-wrap:wrap}
.slot .dot{width:12px;height:12px;border-radius:50%}
.slot .nm{flex:1;min-width:90px;font-weight:600}
.slot select,input[type=text]{background:#171a14;color:var(--parch);border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-family:var(--ui);font-size:14px}
input[type=text]{width:100%;box-sizing:border-box;font-size:16px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.warn{font-size:13px;color:#f0c08a;background:rgba(120,70,20,.25);border:1px solid rgba(201,149,75,.4);border-radius:8px;padding:8px 10px;line-height:1.4}
.x{float:right;border:1px solid var(--line);background:var(--iron2);border-radius:8px;width:36px;height:36px;font-size:16px}
.help p{font-size:14px;line-height:1.5;margin:6px 0;color:#d9cfb5}
.help b{color:var(--bronze2)}
.sk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:4px 0;line-height:1.35}
.sk i{font-style:normal;color:var(--bronze2);width:18px;flex:none;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:12px 0}
.stats div{background:var(--iron2);border:1px solid var(--line);border-radius:8px;padding:8px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.win{color:var(--bronze2)}.lose{color:var(--blood)}
@media (max-height:430px){
  #mini{width:118px;height:81px}
  .cb{height:50px;min-width:56px}.cb img{width:24px;height:24px}
  #panel .ttl{font-size:14px}
  .hp{width:46px}.hp img{width:40px;height:40px}
  #glob button{width:60px;font-size:12px}
}
@media (max-width:560px){
  #bottom{flex-wrap:wrap}
  #panel{order:3;flex-basis:100%}
  #mini{width:120px;height:82px}
  #glob{display:flex;flex-direction:row;flex:1;align-self:flex-start;flex-wrap:wrap}
  #glob button{flex:1;width:auto;min-height:38px}
  #top{font-size:13px;gap:7px}
}
#quick{left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(var(--bh,100px) + 8px);display:flex;gap:5px;align-items:center}
#quick button{height:34px;padding:0 10px;border-radius:17px;border:1px solid var(--line);background:rgba(30,34,26,.9);font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#quick button b{color:var(--bronze2);font-variant-numeric:tabular-nums;margin-left:2px}
#quick button.off{opacity:.45}
#quick .sep{width:6px}
#quick .grp{width:34px;padding:0;position:relative;font-family:var(--disp);font-size:15px}
#quick .grp.has{border-color:var(--bronze)}
#quick .grp b{position:absolute;top:-6px;right:-6px;background:var(--bronze);color:#1b1408;font-family:var(--ui);font-size:10px;border-radius:7px;padding:0 4px;margin:0}
#skillbar{right:calc(env(safe-area-inset-right,0px) + 8px);bottom:calc(var(--bh,100px) + 24px);display:flex;gap:10px;align-items:center}
.sk2{width:60px;height:60px;border-radius:50%;border:2px solid #6d6146;background:radial-gradient(circle at 35% 30%,#4d4838,#1b1d16 75%);position:relative;display:flex;align-items:center;justify-content:center;font-size:25px;color:var(--bronze2);box-shadow:0 4px 14px rgba(0,0,0,.55);padding:0}
.sk2 small{position:absolute;top:100%;margin-top:2px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--parch);white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.sk2 .cdw{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p) * 1turn),transparent 0)}
.sk2 > b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-family:var(--ui)}
.sk2 b.lv{inset:auto;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#2a2a24;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.sk2.ready{border-color:var(--bronze2);box-shadow:0 0 0 1px rgba(232,183,101,.35),0 0 14px rgba(232,183,101,.45),0 4px 14px rgba(0,0,0,.55)}
.sk2.lock{filter:grayscale(1) brightness(.6)}
.sk2.pas{border-style:dashed;font-size:20px;width:48px;height:48px}
.sk2.on{border-color:#ff8a4a;box-shadow:0 0 16px rgba(255,120,60,.7)}
.autob{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(30,34,26,.92);font-size:11px;font-weight:700;letter-spacing:.04em}
.autob.on{border-color:var(--bronze2);background:#4a3f25;color:var(--bronze2)}
.toast.go{pointer-events:auto;cursor:pointer;border-left-color:var(--blood)}
@media (max-width:560px){#quick{bottom:calc(var(--bh,160px) + 96px);flex-wrap:wrap;right:8px}#skillbar{gap:6px}.sk2{width:52px;height:52px;font-size:21px}}
@media (max-height:430px){.sk2{width:54px;height:54px;font-size:22px}#quick button{height:30px;font-size:12px;padding:0 8px}#quick .grp{width:30px}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="top" class="hud" hidden>
    <span class="gold" id="gold">0</span><span class="inc" id="inc"></span>
    <span class="pop" id="pop">0/0</span>
    <span class="pw" id="pw">✦ 0</span>
    <span id="clock">0:00</span>
    <button class="ico" id="bMenu" aria-label="Меню">☰</button>
  </div>
  <div id="heroes" class="hud" hidden></div>
  <div id="toasts" class="hud"></div>
  <div id="hint" class="hud" hidden></div>
  <div id="bottom" class="hud" hidden>
    <canvas id="mini" width="300" height="206"></canvas>
    <div id="panel"></div>
    <div id="glob">
      <button data-act="buildmenu" id="bBuild">Строить</button>
      <button data-act="recruitmenu" id="bRec">Нанять</button>
      <button data-act="powers" id="bPow">Силы</button>
      <button data-act="boxmode" id="bBox">Рамка</button>
    </div>
  </div>
  <div id="quick" class="hud" hidden></div>
  <div id="skillbar" class="hud" hidden></div>
  <div id="scr"></div>
</div>
